name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and publish, for example v0.2.0."
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild, for example v0.2.0."
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

permissions:
  actions: write
  contents: read

jobs:
  setup:
    name: Resolve release context
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      ref: ${{ steps.resolve.outputs.ref }}
      version: ${{ steps.resolve.outputs.version }}
      image: ${{ steps.resolve.outputs.image }}
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [[ -z "${tag}" ]]; then
            echo "Release tag input is required" >&2
            exit 1
          fi
          owner="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          echo "ref=refs/tags/${tag}" >>"${GITHUB_OUTPUT}"
          echo "version=${tag#v}" >>"${GITHUB_OUTPUT}"
          echo "image=ghcr.io/${owner}/tractor-beam-relay" >>"${GITHUB_OUTPUT}"
          commit="$(git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "refs/tags/${tag}^{}" | awk '{print $1}')"
          if [[ -z "${commit}" ]]; then
            commit="$(git ls-remote "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "refs/tags/${tag}" | awk '{print $1}')"
          fi
          if [[ -z "${commit}" ]]; then
            echo "Release tag ${tag} was not found" >&2
            exit 1
          fi
          echo "commit=${commit}" >>"${GITHUB_OUTPUT}"

  client-windows:
    name: Client Bundle Windows
    needs: setup
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TRACTOR_BEAM_GIT_HASH: ${{ needs.setup.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Build Bridge GUI
        run: cargo build --locked --release -p tractor-beam-gui --target x86_64-pc-windows-msvc

      - name: Build Injector
        run: cargo build --locked --release -p tractor-beam-isaac-injector --target i686-pc-windows-msvc

      - name: Build Native Hook
        run: cargo build --locked --release -p tractor-beam-native-hook --target i686-pc-windows-msvc

      - name: Package Client Bundle
        shell: pwsh
        run: |
          $bundleDir = "dist/TractorBeamClient"
          New-Item -ItemType Directory -Force $bundleDir | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/tractor-beam.exe" $bundleDir
          Copy-Item "target/i686-pc-windows-msvc/release/tractor-beam-isaac-injector.exe" $bundleDir
          Copy-Item "target/i686-pc-windows-msvc/release/tractor_beam_native_hook.dll" $bundleDir
          Copy-Item "deploy/client.config.toml" (Join-Path $bundleDir "config.toml")
          $expected = @(
            "config.toml",
            "tractor-beam-isaac-injector.exe",
            "tractor-beam.exe",
            "tractor_beam_native_hook.dll"
          )
          $actual = @(Get-ChildItem -LiteralPath $bundleDir -File | Sort-Object Name | ForEach-Object Name)
          if (Compare-Object $expected $actual) {
            throw "Client Bundle root files differ from the required four-file layout: $($actual -join ', ')"
          }
          Compress-Archive -Path "$bundleDir/*" -DestinationPath "dist/TractorBeam-Client-Windows-x86_64.zip"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-client-windows-x86_64
          path: dist/TractorBeam-Client-Windows-x86_64.zip
          if-no-files-found: error
          retention-days: 7

  relay-linux:
    name: Relay Server Linux x86_64
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRACTOR_BEAM_GIT_HASH: ${{ needs.setup.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: dtolnay/rust-toolchain@1.97.0

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Build Relay Server
        run: cargo build --locked --release -p tractor-beam-relay

      - name: Stage Relay Server binary
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/tractor-beam-relay dist/TractorBeam-Relay-Linux-x86_64
          chmod 0755 dist/TractorBeam-Relay-Linux-x86_64

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-relay-linux-x86_64
          path: dist/TractorBeam-Relay-Linux-x86_64
          if-no-files-found: error
          retention-days: 7

  relay-windows:
    name: Relay Server Windows x86_64
    needs: setup
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      TRACTOR_BEAM_GIT_HASH: ${{ needs.setup.outputs.commit }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Build Relay Server
        run: cargo build --locked --release -p tractor-beam-relay --target x86_64-pc-windows-msvc

      - name: Stage Relay Server binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/tractor-beam-relay.exe" "dist/TractorBeam-Relay-Windows-x86_64.exe"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-relay-windows-x86_64
          path: dist/TractorBeam-Relay-Windows-x86_64.exe
          if-no-files-found: error
          retention-days: 7

  relay-image:
    name: Relay Server GHCR image
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TRACTOR_BEAM_GIT_HASH: ${{ needs.setup.outputs.commit }}
    permissions:
      actions: write
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ needs.setup.outputs.ref }}

      - uses: docker/setup-buildx-action@v4.1.0

      - uses: docker/login-action@v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ needs.setup.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.setup.outputs.tag }}
            type=raw,value=${{ needs.setup.outputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          file: deploy/Dockerfile.relay
          push: true
          build-args: |
            TRACTOR_BEAM_GIT_HASH=${{ needs.setup.outputs.commit }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  assemble:
    name: Assemble release
    needs: [setup, client-windows, relay-linux, relay-windows, relay-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          path: staging
          pattern: release-*
          merge-multiple: true

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp staging/TractorBeam-Client-Windows-x86_64.zip release-assets/
          cp staging/TractorBeam-Relay-Linux-x86_64 release-assets/
          cp staging/TractorBeam-Relay-Windows-x86_64.exe release-assets/
          ls -la release-assets

      - name: Verify release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}"

      - name: Upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "${TAG}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber

  validate:
    name: Validate release assets
    needs: [setup, assemble]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir verify
          ls -la verify

      - name: Verify release assets
        working-directory: verify
        run: |
          set -euo pipefail
          for name in \
            TractorBeam-Client-Windows-x86_64.zip \
            TractorBeam-Relay-Linux-x86_64 \
            TractorBeam-Relay-Windows-x86_64.exe; do
            test -f "${name}" || { echo "missing asset: ${name}" >&2; exit 1; }
          done
          diff -u \
            <(printf '%s\n' \
              config.toml \
              tractor-beam-isaac-injector.exe \
              tractor-beam.exe \
              tractor_beam_native_hook.dll | sort) \
            <(unzip -Z1 TractorBeam-Client-Windows-x86_64.zip | sort)
